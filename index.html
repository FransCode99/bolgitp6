<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profil Fransiskus</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #cfd9df, #e2ebf0);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .profile-box {
      background-color: #ffffff;
      border-radius: 12px;
      padding: 40px 30px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
    }
    .profile-box h1 {
      color: #1a237e;
      margin-bottom: 10px;
    }
    .profile-box p {
      font-size: 1.1em;
      color: #424242;
    }
  </style>
</head>
<body>
  <div class="profile-box">
    <h1>Fransiskus Krisna Murti</h1>
    <p>Mahasiswa aktif di Universitas Teknologi Digital Indonesia (UTDI)</p>
  </div>
</body>
</html>
